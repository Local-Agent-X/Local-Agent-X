name: Rolling Installer (tracks main)

# Builds the Windows .exe AND the macOS .dmg GUI installers that, AT RUNTIME,
# download the latest `main` branch source instead of a pinned tag — so neither
# needs rebuilding when app code changes. This is the WIP/daily-update path:
# publish ONCE to the stable `rolling` pre-release, point the website's
# "Download for Windows / Mac" links at the asset URLs below, and every download
# thereafter installs current `main`:
#
#   https://github.com/<owner>/<repo>/releases/download/rolling/Install.Local.Agent.X.Windows.Installer.exe
#   https://github.com/<owner>/<repo>/releases/download/rolling/Install.Local.Agent.X.Mac.Installer.dmg
#
# This workflow runs when the installer itself changes (this csproj /
# SourceDownloader / install-common.mjs / build-mac-installer.sh), NOT on
# ordinary app updates — the built installers already serve latest main.
#
# The macOS path is the SAME signing + notarization flow as installer-release.yml
# (same secrets), so the rolling .dmg is still a one-click, no-Gatekeeper install.
# The only difference vs the tagged release: no -p:InstallerSourceTag is passed,
# so the csproj defaults to ref "main" / kind "heads". At install time the
# installer resolves that ref to an immutable commit sha and downloads
# archive/<sha>.tar.gz (SourceDownloader.ResolveCommitAsync) — it never fetches
# the mutable refs/heads/main.tar.gz.
#
# For reproducible, pinned releases use installer-release.yml instead (push a
# v* tag); that path bakes in the tag and never tracks main.
#
# Windows publishing requires AZURE_SIGN_TENANT_ID, AZURE_SIGN_CLIENT_ID,
# AZURE_SIGN_CLIENT_SECRET, AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT, and
# AZURE_SIGN_CERT_PROFILE secrets plus the exact WIN_SIGN_EXPECTED_SUBJECT
# repository variable. Missing or drifted signing configuration fails closed.
#
# Integrity of the in-app rolling update (R4-06): the app resolves main → an
# immutable commit sha and binds the executed bytes to that sha (src/ota-update.ts
# downloadMainTarball/applyUpdate refuse to extract without a resolved commit).
# Bytes-level checksum verification ON TOP of the commit-pin is now handled by a
# SEPARATE workflow, .github/workflows/rolling-source.yml, which publishes a
# frozen per-commit `lax-source-<sha>.tar.gz` + `.sha256` to the same `rolling`
# release on every push to main; downloadMainTarball fetches + verifies that
# asset. This installer workflow only builds the .exe/.dmg and is intentionally
# path-filtered instead of running on every main push.

on:
  push:
    branches:
      - main
    paths:
      - "installer/**"
      - "scripts/install-common.mjs"
      - "scripts/installer/**"
      - "scripts/build-mac-installer.sh"
      - "scripts/package-signed-mac-update.mjs"
      - "scripts/fetch-electron-bundle.mjs"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "desktop/src/**"
      - "desktop/build/**"
      - ".github/workflows/installer-rolling.yml"
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release needs write to publish the asset

jobs:
  build-windows-rolling:
    name: Windows rolling installer (.exe)
    runs-on: windows-latest
    env:
      AZURE_SIGN_TENANT_ID: ${{ secrets.AZURE_SIGN_TENANT_ID }}
      AZURE_SIGN_CLIENT_ID: ${{ secrets.AZURE_SIGN_CLIENT_ID }}
      AZURE_SIGN_CLIENT_SECRET: ${{ secrets.AZURE_SIGN_CLIENT_SECRET }}
      # electron-builder's Azure Trusted Signing provider consumes the standard
      # Azure Identity names. Keep the repository's existing secret contract and
      # map it here so signing happens before latest.yml hashes are generated.
      AZURE_TENANT_ID: ${{ secrets.AZURE_SIGN_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGN_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGN_CLIENT_SECRET }}
      AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
      AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
      AZURE_SIGN_CERT_PROFILE: ${{ secrets.AZURE_SIGN_CERT_PROFILE }}
      WIN_SIGN_EXPECTED_SUBJECT: ${{ vars.WIN_SIGN_EXPECTED_SUBJECT }}
    steps:
      - uses: actions/checkout@v6

      - name: Require Windows release signing configuration
        shell: pwsh
        run: |
          $required = [ordered]@{
            AZURE_SIGN_TENANT_ID = $env:AZURE_SIGN_TENANT_ID
            AZURE_SIGN_CLIENT_ID = $env:AZURE_SIGN_CLIENT_ID
            AZURE_SIGN_CLIENT_SECRET = $env:AZURE_SIGN_CLIENT_SECRET
            AZURE_SIGN_ENDPOINT = $env:AZURE_SIGN_ENDPOINT
            AZURE_SIGN_ACCOUNT = $env:AZURE_SIGN_ACCOUNT
            AZURE_SIGN_CERT_PROFILE = $env:AZURE_SIGN_CERT_PROFILE
            WIN_SIGN_EXPECTED_SUBJECT = $env:WIN_SIGN_EXPECTED_SUBJECT
          }
          $missing = @($required.GetEnumerator() | Where-Object {
            [string]::IsNullOrWhiteSpace([string]$_.Value)
          } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            Write-Error "Windows release signing configuration is incomplete: $($missing -join ', ')"
            exit 1
          }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build signed Windows desktop package and update metadata
        shell: pwsh
        working-directory: desktop
        run: |
          npm --prefix .. ci
          npm ci
          npm run build
          npx electron-builder --win nsis --x64 --publish never `
            --config.win.azureSignOptions.endpoint="$env:AZURE_SIGN_ENDPOINT" `
            --config.win.azureSignOptions.certificateProfileName="$env:AZURE_SIGN_CERT_PROFILE" `
            --config.win.azureSignOptions.codeSigningAccountName="$env:AZURE_SIGN_ACCOUNT" `
            --config.win.azureSignOptions.FileDigest=SHA256 `
            --config.win.azureSignOptions.TimestampRfc3161=http://timestamp.acs.microsoft.com `
            --config.win.azureSignOptions.TimestampDigest=SHA256 `
            --config.win.publisherName="$env:WIN_SIGN_EXPECTED_SUBJECT"

      - name: Verify signed Windows desktop package before publishing metadata
        shell: pwsh
        run: |
          $expectedPackage = "desktop/release/Local-Agent-X-Desktop-$((Get-Content desktop/package.json | ConvertFrom-Json).version)-win-x64.exe"
          $expectedBlockmap = "$expectedPackage.blockmap"
          $installedExecutable = "desktop/release/win-unpacked/LocalAgentX.exe"
          $metadata = "desktop/release/latest.yml"
          foreach ($path in @($expectedPackage, $expectedBlockmap, $installedExecutable, $metadata)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              Write-Error "Missing required Windows desktop update asset: $path"
              exit 1
            }
          }
          foreach ($path in @($installedExecutable, $expectedPackage)) {
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            if ($sig.Status -ne 'Valid') { Write-Error "Desktop signature not Valid for ${path}: $($sig.Status) - $($sig.StatusMessage)"; exit 1 }
            if ($null -eq $sig.TimeStamperCertificate) { Write-Error "Desktop signature has no trusted timestamp for ${path} - refusing to ship."; exit 1 }
            if ($sig.SignerCertificate.Subject -cne $env:WIN_SIGN_EXPECTED_SUBJECT) {
              Write-Error "Desktop signing identity drift for ${path}: subject [$($sig.SignerCertificate.Subject)] does not exactly match expected [$env:WIN_SIGN_EXPECTED_SUBJECT]"
              exit 1
            }
          }
          $yaml = Get-Content -LiteralPath $metadata -Raw
          if (-not $yaml.Contains((Split-Path -Leaf $expectedPackage))) {
            Write-Error "latest.yml does not name the exact signed desktop package."
            exit 1
          }

      - name: Smoke-test the signed Windows desktop installer
        shell: pwsh
        run: |
          $package = "desktop/release/Local-Agent-X-Desktop-$((Get-Content desktop/package.json | ConvertFrom-Json).version)-win-x64.exe"
          $installed = Join-Path $env:LOCALAPPDATA "Programs\local-agent-x-desktop\LocalAgentX.exe"
          $process = Start-Process -FilePath $package -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Error "Signed desktop installer smoke test failed with exit $($process.ExitCode)."
            exit 1
          }
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
            Write-Error "Signed desktop installer exited successfully but did not create $installed."
            Get-ChildItem -LiteralPath (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Filter "LocalAgentX.exe" -ErrorAction SilentlyContinue
            exit 1
          }
          $sig = Get-AuthenticodeSignature -LiteralPath $installed
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -cne $env:WIN_SIGN_EXPECTED_SUBJECT) {
            Write-Error "Installed desktop executable failed signature verification."
            exit 1
          }

      - name: Stage bundled Electron runtime
        # Download the pinned Electron archive into installer/electron-bundle/ so
        # the publish below embeds it (Installer.csproj). The installed app then
        # extracts it offline instead of downloading the ~190 MB runtime — the #1
        # install failure (CDN/proxy block, AV quarantine). Verified against the
        # release SHASUMS256 by the script.
        shell: pwsh
        run: node scripts/fetch-electron-bundle.mjs --platform win32 --arch x64

      - name: Publish main-tracking installer
        # No -p:InstallerSourceTag → the csproj defaults to ref "main" / kind
        # "heads", so the built .exe resolves main → sha and fetches that
        # commit's archive at runtime.
        # The build commit doesn't matter — a stale build still serves latest
        # main — but checkout@v4 gives us current installer code regardless.
        shell: pwsh
        run: |
          dotnet publish installer/Installer.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            --nologo
          $src = "installer/bin/Release/net8.0/win-x64/publish/LocalAgentXInstaller.exe"
          $dst = "Install Local Agent X Windows Installer.exe"
          Copy-Item -LiteralPath $src -Destination $dst -Force
          Write-Host ("Size: {0:N1} MB" -f ((Get-Item -LiteralPath $dst).Length / 1MB))

      - name: Sign the installer (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_SIGN_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_SIGN_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_SIGN_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGN_CERT_PROFILE }}
          files: ${{ github.workspace }}\Install Local Agent X Windows Installer.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signing identity (fail-closed on cert drift)
        # Artifact Signing rotates short-lived certificates, so pin the stable,
        # public certificate subject instead of a rotating thumbprint.
        shell: pwsh
        run: |
          $exe = "Install Local Agent X Windows Installer.exe"
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne 'Valid') { Write-Error "Signature not Valid: $($sig.Status) - $($sig.StatusMessage)"; exit 1 }
          if ($null -eq $sig.TimeStamperCertificate) { Write-Error "Signature has no trusted timestamp - refusing to ship."; exit 1 }
          $subj = $sig.SignerCertificate.Subject
          $want = $env:WIN_SIGN_EXPECTED_SUBJECT
          if ($subj -cne $want) {
            Write-Error "Signing identity drift: subject [$subj] does not exactly match expected [$want] - refusing to ship."
            exit 1
          }
          Write-Host "Signing identity OK: $subj"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-rolling
          path: |
            Install Local Agent X Windows Installer.exe
            desktop/release/Local-Agent-X-Desktop-*-win-x64.exe
            desktop/release/Local-Agent-X-Desktop-*-win-x64.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

  build-macos-rolling:
    name: macOS rolling installer (.dmg, signed + notarized)
    runs-on: macos-latest
    # KEYCHAIN_PATH is exported via $GITHUB_ENV in the first step below —
    # job-level `env` can't reference ${{ runner.* }}, only step-level can.
    env:
      DMG_PATH: installer/dist-mac/Install Local Agent X Mac Installer.dmg
      APP_PATH: installer/dist-mac/Install Local Agent X Mac Installer.app
      MAC_EXPECTED_TEAM_ID: ${{ vars.MAC_EXPECTED_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Require macOS release signing configuration
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_API_KEY_P8: ${{ secrets.MACOS_API_KEY_P8 }}
          MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD MACOS_KEYCHAIN_PWD \
            MACOS_SIGN_IDENTITY MACOS_API_KEY_P8 MACOS_API_KEY_ID \
            MACOS_API_ISSUER_ID MAC_EXPECTED_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::macOS release signing configuration is incomplete: $name"
              exit 1
            fi
          done

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Import Developer ID certificate into temp keychain
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          CERT_PATH="${RUNNER_TEMP}/cert.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build signed and notarized macOS desktop packages and update metadata
        working-directory: desktop
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.MACOS_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_KEY_PATH="${RUNNER_TEMP}/AuthKey-electron-builder.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$API_KEY_PATH"
          trap 'rm -f "$API_KEY_PATH"' EXIT
          export APPLE_API_KEY="$API_KEY_PATH"
          export CSC_NAME="${MACOS_SIGN_IDENTITY#Developer ID Application: }"
          npm --prefix .. ci
          npm ci
          npm run build
          npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Repack macOS update ZIP after signing is finalized
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          APPS=()
          while IFS= read -r -d '' app; do
            APPS+=("$app")
          done < <(find desktop/release -maxdepth 3 -type d -name 'Local Agent X.app' -print0)
          if [ "${#APPS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one finalized Local Agent X.app, found ${#APPS[@]}"
            exit 1
          fi
          node scripts/package-signed-mac-update.mjs \
            --app="${APPS[0]}" \
            --zip="desktop/release/Local-Agent-X-Desktop-${VERSION}-mac-arm64.zip" \
            --blockmap="desktop/release/Local-Agent-X-Desktop-${VERSION}-mac-arm64.zip.blockmap" \
            --metadata="desktop/release/latest-mac.yml" \
            --app-builder="desktop/node_modules/app-builder-bin/mac/app-builder_arm64" \
            --version="$VERSION"

      - name: Verify signed and notarized macOS desktop package before publishing metadata
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          ZIP="desktop/release/Local-Agent-X-Desktop-${VERSION}-mac-arm64.zip"
          DMG="desktop/release/Local-Agent-X-Desktop-${VERSION}-mac-arm64.dmg"
          METADATA="desktop/release/latest-mac.yml"
          for path in "$ZIP" "$ZIP.blockmap" "$DMG" "$METADATA"; do
            if [ ! -f "$path" ]; then
              echo "::error::Missing required macOS desktop update asset: $path"
              exit 1
            fi
          done
          APPS=()
          while IFS= read -r -d '' app; do
            APPS+=("$app")
          done < <(find desktop/release -maxdepth 3 -type d -name 'Local Agent X.app' -print0)
          if [ "${#APPS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one packaged Local Agent X.app, found ${#APPS[@]}"
            exit 1
          fi
          APP="${APPS[0]}"
          codesign --verify --deep --strict --verbose=2 "$APP"
          GOT=$(codesign -dvv "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          if [ "$GOT" != "$MAC_EXPECTED_TEAM_ID" ]; then
            echo "::error::Desktop signing identity drift: TeamIdentifier=$GOT, expected $MAC_EXPECTED_TEAM_ID"
            exit 1
          fi
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          SMOKE_LOG="${RUNNER_TEMP}/local-agent-x-desktop-smoke.log"
          "$APP/Contents/MacOS/Local Agent X" >"$SMOKE_LOG" 2>&1 &
          APP_PID=$!
          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat "$SMOKE_LOG"
            wait "$APP_PID" || true
            echo "::error::Signed macOS desktop app exited during launch smoke test."
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true
          for _ in 1 2 3 4 5; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$APP_PID" 2>/dev/null; then
            kill -KILL "$APP_PID"
          fi
          wait "$APP_PID" || true
          if ! grep -Fq "$(basename "$ZIP")" "$METADATA"; then
            echo "::error::latest-mac.yml does not name the exact signed desktop ZIP."
            exit 1
          fi

      - name: Stage bundled Electron runtime
        # Same as the Windows job: embed the pinned Electron archive so the
        # installed app extracts it offline. macOS runners are arm64.
        run: node scripts/fetch-electron-bundle.mjs --platform darwin --arch arm64

      - name: Build + sign .app bundle (main-tracking)
        # NO INSTALLER_SOURCE_TAG → build-mac-installer.sh defaults SRC_TAG to
        # "main", and the csproj maps that to refs/heads/main: the .dmg fetches
        # latest main source at install time, exactly like the Windows rolling
        # build. This is the ONLY difference vs installer-release.yml's mac job.
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          chmod +x scripts/build-mac-installer.sh
          ./scripts/build-mac-installer.sh

      - name: Verify signing identity (fail-closed on cert drift)
        # Notarization + in-app-update continuity depend on the Apple Team. If a
        # rebuild ever signs with a different Team/Developer ID, fail HERE — before
        # wasting a ~30-min notarization cycle. Pin repo VARIABLE MAC_EXPECTED_TEAM_ID
        # (the 10-char Team ID is public — it's in every shipped binary). Skips
        # when the var is unset (non-breaking until you set it).
        if: ${{ vars.MAC_EXPECTED_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          GOT=$(codesign -dvv "$APP_PATH" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          WANT="${{ vars.MAC_EXPECTED_TEAM_ID }}"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::Signing identity drift: TeamIdentifier=$GOT, expected $WANT. A Team/cert swap breaks notarization + update continuity - refusing to ship."
            exit 1
          fi
          echo "Signing identity OK: TeamIdentifier=$GOT"

      - name: Reclaim disk space before .dmg packaging
        run: |
          sudo rm -rf ~/Library/Developer/CoreSimulator || true
          sudo rm -rf /Library/Developer/CoreSimulator || true
          ACTIVE_XCODE="$(xcode-select -p 2>/dev/null | sed -E 's|/Contents/Developer$||')"
          for x in /Applications/Xcode_*.app; do
            if [ "$x" != "$ACTIVE_XCODE" ]; then
              echo "removing $x"
              sudo rm -rf "$x" || true
            fi
          done
          rm -rf installer/bin installer/obj || true
          df -h /

      - name: Package .app into .dmg
        # See installer-release.yml for why we don't use the one-shot
        # `-srcfolder ... -format UDZO` (it auto-sizes the intermediate image
        # with no padding and fails with "No space left on device"). Build a
        # padded read/write image, ditto the .app in, detach, convert to UDZO.
        run: |
          set -euo pipefail
          VOL="Local Agent X"
          RW_DMG="${RUNNER_TEMP}/lax-installer-rw.dmg"
          MOUNT_DIR="${RUNNER_TEMP}/lax-installer-mnt"
          APP_MB=$(du -sm "$APP_PATH" | awk '{print $1}')
          SIZE_MB=$(( APP_MB + 200 ))
          echo "app=${APP_MB}MB -> image=${SIZE_MB}MB"
          hdiutil create -volname "$VOL" -fs HFS+ -size "${SIZE_MB}m" -ov "$RW_DMG"
          mkdir -p "$MOUNT_DIR"
          hdiutil attach "$RW_DMG" -mountpoint "$MOUNT_DIR" -nobrowse
          ditto "$APP_PATH" "$MOUNT_DIR/$(basename "$APP_PATH")"
          # Brand the mounted volume with the LAX icon. .VolumeIcon.icns lives
          # inside the image filesystem, so it survives signing, notarization,
          # and HTTP download — unlike a custom icon on the .dmg *file*, which
          # is stored in an extended attribute GitHub strips on download.
          cp installer/mac-bundle/icon.icns "$MOUNT_DIR/.VolumeIcon.icns"
          SetFile -c icnC "$MOUNT_DIR/.VolumeIcon.icns" || true
          SetFile -a C "$MOUNT_DIR" || true
          hdiutil detach "$MOUNT_DIR"
          hdiutil convert "$RW_DMG" -format UDZO -ov -o "$DMG_PATH"
          rm -f "$RW_DMG"
          ls -la installer/dist-mac

      - name: Sign the .dmg
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --sign "$APPLE_SIGN_IDENTITY" --timestamp "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

      - name: Notarize .dmg with notarytool
        id: notarize
        env:
          MACOS_API_KEY_P8: ${{ secrets.MACOS_API_KEY_P8 }}
          MACOS_API_KEY_ID: ${{ secrets.MACOS_API_KEY_ID }}
          MACOS_API_ISSUER_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
        run: |
          set -u
          KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          echo "$MACOS_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          trap 'rm -f "$KEY_PATH"' EXIT
          SUBMIT_JSON=$(xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$MACOS_API_KEY_ID" \
            --issuer "$MACOS_API_ISSUER_ID" \
            --output-format json) || { echo "::error::notarytool submit failed"; exit 1; }
          echo "$SUBMIT_JSON"
          SUBMISSION_ID=$(echo "$SUBMIT_JSON" | jq -r '.id')
          echo "::notice title=Notary submission::$SUBMISSION_ID"
          DEADLINE=$(( $(date -u +%s) + 5400 ))
          LAST_STATUS=""
          while [ "$(date -u +%s)" -lt "$DEADLINE" ]; do
            INFO_JSON=$(xcrun notarytool info "$SUBMISSION_ID" \
              --key "$KEY_PATH" \
              --key-id "$MACOS_API_KEY_ID" \
              --issuer "$MACOS_API_ISSUER_ID" \
              --output-format json 2>&1) || INFO_JSON=""
            STATUS=$(echo "$INFO_JSON" | jq -r '.status // empty' 2>/dev/null || echo "")
            if [ "$STATUS" != "$LAST_STATUS" ]; then
              echo "[$(date -u +%H:%M:%S)] notarize status: ${STATUS:-<network err, retrying>}"
              LAST_STATUS="$STATUS"
            fi
            case "$STATUS" in
              Accepted)
                echo "✅ Apple accepted submission $SUBMISSION_ID"
                exit 0
                ;;
              Invalid|Rejected)
                echo "::error::Apple rejected submission $SUBMISSION_ID with status=$STATUS"
                xcrun notarytool log "$SUBMISSION_ID" \
                  --key "$KEY_PATH" --key-id "$MACOS_API_KEY_ID" --issuer "$MACOS_API_ISSUER_ID" || true
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::Timed out after 90 min. Submission ID: $SUBMISSION_ID"
          exit 1

      - name: Staple notarization ticket to .dmg
        run: xcrun stapler staple "$DMG_PATH"

      - name: Verify Gatekeeper assessment
        run: |
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$DMG_PATH"

      - name: Delete temp keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer-rolling
          path: |
            installer/dist-mac/Install Local Agent X Mac Installer.dmg
            desktop/release/Local-Agent-X-Desktop-*-mac-arm64.zip
            desktop/release/Local-Agent-X-Desktop-*-mac-arm64.zip.blockmap
            desktop/release/Local-Agent-X-Desktop-*-mac-arm64.dmg
            desktop/release/latest-mac.yml
          if-no-files-found: error

  # Test gate. publish-rolling is the ONLY job that writes the fleet updater feed
  # (desktop-stable/latest.yml) and the `rolling` download release; the build jobs
  # merely upload artifacts. So gating publish-rolling on the blocking unit +
  # desktop suites means a build that fails tests — including the rollback
  # schema-version guard and the state-reader corruption-tolerance locks — CANNOT
  # reach a single user's updater. Mirrors security.yml's blocking commands. This
  # is the safeguard that turns "we noticed after bricking the fleet" into "a bad
  # build cannot leave the building" (added after the 2026-07 rollback-journal wedge).
  gate-tests:
    name: Test gate (blocks publish to the fleet feed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate test manifest
        run: npm run test:prepare
      - name: Unit tests (vitest, blocking)
        run: npm run test:unit
      - name: Desktop tests (vitest, blocking)
        run: npm run test:desktop

  publish-rolling:
    name: Publish/refresh the `rolling` pre-release
    needs: [build-windows-rolling, build-macos-rolling, gate-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the workflow source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: List downloaded artifacts
        run: find dist -type f | sort

      - name: Generate native runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const versionPattern = /^\d+(?:\.\d+)+$/;
          const lock = JSON.parse(await readFile("desktop/package-lock.json", "utf8"));
          const electronVersion = lock.packages?.["node_modules/electron"]?.version;
          if (typeof electronVersion !== "string" || !versionPattern.test(electronVersion)) {
            throw new Error("desktop/package-lock.json does not contain a valid exact node_modules/electron version");
          }

          const metadataUrl = "https://releases.electronjs.org/releases.json";
          const response = await fetch(metadataUrl, {
            headers: { "User-Agent": "LocalAgentX-runtime-manifest/1.0" },
          });
          if (!response.ok) {
            throw new Error(`Electron releases metadata returned HTTP ${response.status}`);
          }
          const releases = await response.json();
          if (!Array.isArray(releases)) {
            throw new Error("Electron releases metadata is malformed");
          }
          const release = releases.find((entry) => entry?.version === electronVersion);
          const chromiumVersion = release?.chrome;
          if (typeof chromiumVersion !== "string" || !versionPattern.test(chromiumVersion)) {
            throw new Error(`No valid Chromium version in official metadata for Electron ${electronVersion}`);
          }

          const manifest = { schemaVersion: 1, electronVersion, chromiumVersion };
          await writeFile("runtime-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          NODE
          cat runtime-manifest.json

      - name: Staged rollout (opt-in via ROLLOUT_PERCENTAGE)
        # Blast-radius limiter. An auto-updater can't downgrade, so the defense
        # against a bug that slips past the test gate is to reach only a fraction
        # of the fleet first, verify, then widen — leaving time to fix-forward
        # before everyone is hit. electron-updater honors a top-level
        # `stagingPercentage` in latest.yml (deterministic per-machine GUID), so
        # setting the repo VARIABLE ROLLOUT_PERCENTAGE to 1..99 stages this
        # release; unset or 100 publishes to the whole fleet as before (this step
        # is a no-op then, so default behavior is unchanged).
        shell: bash
        env:
          ROLLOUT_PERCENTAGE: ${{ vars.ROLLOUT_PERCENTAGE }}
        run: |
          set -euo pipefail
          pct="${ROLLOUT_PERCENTAGE:-100}"
          if [[ "$pct" =~ ^[0-9]+$ ]] && [ "$pct" -ge 1 ] && [ "$pct" -lt 100 ]; then
            for f in dist/windows-installer-rolling/desktop/release/latest.yml \
                     dist/macos-installer-rolling/desktop/release/latest-mac.yml; do
              if [ -f "$f" ] && ! grep -q '^stagingPercentage:' "$f"; then
                printf 'stagingPercentage: %s\n' "$pct" >> "$f"
                echo "staged rollout: $f -> ${pct}%"
              fi
            done
          else
            echo "Full rollout (ROLLOUT_PERCENTAGE unset or 100)."
          fi

      - name: Publish signed native desktop update feed
        # One release mutation after both platform jobs succeed keeps metadata
        # and the signed packages it hashes in lockstep at a stable feed URL.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: desktop-stable
          name: Local Agent X — Desktop Stable Update Feed
          body: >
            Signed native desktop packages and updater metadata for installed
            Local Agent X apps. This fixed release is maintained automatically;
            use the rolling installer release for first-time installation.
          prerelease: false
          make_latest: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/windows-installer-rolling/desktop/release/Local-Agent-X-Desktop-*-win-x64.exe
            dist/windows-installer-rolling/desktop/release/Local-Agent-X-Desktop-*-win-x64.exe.blockmap
            dist/windows-installer-rolling/desktop/release/latest.yml
            dist/macos-installer-rolling/desktop/release/Local-Agent-X-Desktop-*-mac-arm64.zip
            dist/macos-installer-rolling/desktop/release/Local-Agent-X-Desktop-*-mac-arm64.zip.blockmap
            dist/macos-installer-rolling/desktop/release/Local-Agent-X-Desktop-*-mac-arm64.dmg
            dist/macos-installer-rolling/desktop/release/latest-mac.yml

      - name: Publish/refresh the `rolling` pre-release
        # Re-uses the fixed `rolling` tag and replaces the assets in place, so the
        # download URLs are stable across re-runs.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: rolling
          name: Local Agent X — Latest Install (Windows + macOS)
          body: >
            **The recommended download.** Windows + macOS installers that fetch
            the latest source at install time, so a fresh install is always
            current. After install, the app checks `main` on launch and offers a
            one-click in-app update (with a notification banner), so you stay
            current without re-downloading. The Windows .exe is Authenticode-
            signed with Azure Artifact Signing; the macOS .dmg is Developer ID-
            signed and Apple-notarized. For a specific pinned version, see the
            individual `vX.Y.Z` releases below.
          # Featured "Latest" release: non-prerelease + make_latest so new users
          # landing on the releases page get this auto-latest installer first,
          # not a frozen version tag. The `rolling` tag keeps the download URL
          # stable across rebuilds.
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/windows-installer-rolling/Install Local Agent X Windows Installer.exe
            dist/macos-installer-rolling/installer/dist-mac/Install Local Agent X Mac Installer.dmg
            runtime-manifest.json
