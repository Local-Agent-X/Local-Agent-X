name: Pricing recheck

# Weekly recheck of src/pricing/model-prices.ts (rates) and
# src/context-manager/model-windows.ts (context windows) against LiteLLM's
# model file. A red run IS the alert: it means a provider repriced or resized
# a model we list (or the file became unreachable). Fix by confirming on the
# provider's pricing/model page, then `node scripts/check-pricing-coverage.mjs
# --apply` locally, review the diff and commit — or `// pin:` a window row the
# provider's docs contradict LiteLLM on. The run also lists first-party chat
# models the providers serve that LAX does not (a WARN, never red): review
# them for the registry. This job never commits or opens PRs.

on:
  schedule:
    # Mondays 10:00 UTC — an hour after the weekly security run.
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pricing:
    name: Pricing drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Dependency-free script: no npm ci needed.
      - name: Recheck model prices (strict)
        run: node scripts/check-pricing-coverage.mjs --strict
